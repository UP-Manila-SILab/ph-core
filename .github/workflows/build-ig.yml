# This CI/CD workflow was derived from the HL7 FHIR IPS project:
# https://github.com/HL7/fhir-ips/blob/master/.github/workflows/validate-docs.yml
# Original license: Apache 2.0 (per HL7 FHIR licensing)
# Modified to follow linear build pattern from PH Core IG
# Docker implementation inspired by:
# https://www.argentixinfo.com/archives/156 (Automating Github FHIR IG Builds)

name: Build PH Core FHIR IG

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Validate branch name
        env:
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
        run: |
          if echo "$BRANCH_NAME" | grep -q '/'; then
            echo "::error::Branch name contains '/'. Use hyphens instead."
            exit 1
          fi
          if echo "$BRANCH_NAME" | grep -qE '[\\~^:\[\] ]'; then
            echo "::error::Branch name contains invalid special characters."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          # Checkout the PR branch tip as-is, not a simulated merge commit
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      # Cache system dependencies (gems + npm) to speed up install steps.
      # To invalidate this cache (e.g. when bumping package versions), change
      # the key suffix below: deps-v1 → deps-v2, deps-v3, etc.
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            /var/lib/gems
          key: ${{ runner.os }}-deps-v1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz
          sudo gem install jekyll
          sudo npm install -g fsh-sushi

      # Cache the pinned IG Publisher JAR. The version is also part of the
      # terminology-cache key because publisher upgrades can change validation
      # and cache behavior.
      - name: Cache IG Publisher
        uses: actions/cache@v4
        with:
          path: ./input-cache/publisher.jar
          key: ig-publisher-2.3.4-${{ runner.os }}

      - name: Cache terminology data
        uses: actions/cache@v4
        with:
          path: ./input-cache/txcache
          key: txcache-${{ runner.os }}-publisher-2.3.4-${{ hashFiles('sushi-config.yaml', 'input/fsh/**/*.fsh') }}
          restore-keys: |
            txcache-${{ runner.os }}-publisher-2.3.4-

      - name: Build IG
        timeout-minutes: 15
        run: |
          mkdir -p ./input-cache
          # Pin CI to a reviewed Publisher release for reproducible validation.
          if [ ! -f ./input-cache/publisher.jar ]; then
            curl --fail --location --show-error \
              https://github.com/HL7/fhir-ig-publisher/releases/download/2.3.4/publisher.jar \
              --output ./input-cache/publisher.jar
          fi
          export JAVA_TOOL_OPTIONS="${JAVA_TOOL_OPTIONS:-} -Dfile.encoding=UTF-8"
          # Terminology validation remains mandatory. Use the explicit HTTPS R4
          # endpoint and restored terminology cache; fail within the step timeout
          # if the service cannot complete validation instead of disabling it.
          java -jar ./input-cache/publisher.jar -ig . -tx https://tx.fhir.org/r4
          
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ig-output
          path: ./output

      - name: QA Gate
        run: |
          if [ ! -f output/qa.json ]; then
            echo "::error::No qa.json found in output/. Failing for safety."
            exit 1
          fi

          echo "📄 Printing qa.json for inspection..."
          cat output/qa.json
          
          ERRORS=$(jq -r '.errs // 0' output/qa.json)
          if [ "$ERRORS" -gt 0 ]; then
            echo "::error::QA errors found: $ERRORS"
            exit 1
          fi
          echo "✅ QA passed: $ERRORS errors"
